  # 完整执行：阶段 0 → 10
  full:
    required:
      - step-1
      - step-2
      - step-3
      - step-4
      - step-4_5
      - step-5
      - step-5_5
      - step-6
      - step-7
      - step-8
      - step-9
      - step-10
  
  # micro-fix：仅 4.5 → 7
  micro-fix:
    required:
      - step-4_5
      - step-5
      - step-5_5
      - step-6
      - step-7
    excluded:
      - step-1
      - step-2
      - step-3
      - step-4
      - step-8
      - step-9
      - step-10
  
  iteration-fix:
    required:
      - step-4_5
