status: implemented
last_updated: "2026-05-14T20:50:00+08:00"
implemented_lints:
  - path-lint           # R1-R5 路径门控
  - interactive-options-lint  # C1-C8 选项一致性
  - devlog-dir-name-lint  # 4 项 dev-logs 命名
  - doc-platform-lint          # 6 项 文档平台 决策
  - devlog-integrity-lint     # devlog 双件齐全
  - doc-platform-doc-lint      # 6 项 文档平台 文档正文质量（tech-doc Skill 资产，跨 Skill 引用）
  - working-context-freshness-lint  # 工作上下文更新新鲜度门控
