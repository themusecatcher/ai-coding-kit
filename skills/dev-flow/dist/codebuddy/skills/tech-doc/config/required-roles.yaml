# tech-doc / 必填角色清单 + 人员映射（数据驱动单一权威源）
#
# 用途：
#   - LLM 在生成/更新 tech-proposal 时按本配置校验人员信息是否齐全
#   - 未来脚本（如 doc-lint 的扩展）可读取本配置动态校验占位符
#
# 维护原则（数据驱动）：
#   - 改角色清单 / 改字段映射 / 改条件必填规则 → 只改本文件
#   - 模块文档用「详见 config/required-roles.yaml」引用本文件
#
# 来源：doc-platform-doc.md 关键人员信息校验规范

# ========================================
# 校验流程
# ========================================
validation_flow:
  - "从任务平台提取人员信息：查询需求详情后，逐一提取上述角色对应的人员（未配置任务平台时跳过本校验）"
  - "逐项校验：检查每个必填角色是否已获取到有效的人员信息（非空、非占位符）"
  - "缺失汇总：如有必填角色缺失，汇总所有缺失项一次性报告给用户"
  - "等待用户补充：用户提供缺失信息后，将补充的人员信息合并到变量中"
  - "再次校验：确认所有必填角色已齐全后，才继续进入文档生成/更新步骤"

core_principle: "人员信息不完整时，禁止用占位符（如 {待补充}、TBD）直接生成文档；必须先由用户补充完整。例外：选填角色（如视觉设计）在确认无设计稿的情况下，可以省略该行，无需用占位符。"

# ========================================
# 必填角色清单
# 适用场景：tech-proposal 文档生成
# ========================================
required_roles:
  - role: "产品"
    template_var: "{产品负责人}"
    required: true
    task_fields:
      - "创建人"
      - "处理人"
    note: "需求的产品负责人"

  - role: "后台开发"
    template_var: "{后台开发}"
    required: true
    task_fields:
      - "开发人员"
      - "自定义字段"
    note: "后端接口提供方"

  - role: "PM"
    template_var: "{PM}"
    required: true
    task_fields:
      - "需求PM（自定义字段）"
    note: "需求项目管理负责人"

  - role: "测试"
    template_var: "{测试负责人}"
    required: true
    task_fields:
      - "测试人员"
    note: "测试用例负责人"

  - role: "前端开发"
    template_var: "{前端开发}"
    required: true
    task_fields: []
    default_value: "{yourname}"
    note: "默认当前用户（{yourname}）"

  - role: "视觉设计"
    template_var: "{视觉设计}"
    required: conditional
    task_fields:
      - "参与人"
      - "自定义字段"
    conditional_rule:
      condition_any:
        - "工作上下文 YAML signals.figma_url 非空"
        - "工作上下文 ## 需求 → 参考 中含 Figma 链接"
      when_true: "必填，且「需求背景」表格必须有「设计稿（Figma）」行"
      when_false: "选填，可整行省略，无需占位符"
    note: "条件必填：含 Figma 链接时必填，否则可省略"

# ========================================
# 占位符策略（与 doc-platform-lint.sh 检查 1 对齐）
# ========================================
placeholder_policy:
  forbidden_in_published_doc:
    description: "以下占位符发布前必须替换，由 doc-platform-lint.sh placeholder_clean 检查兜底"
    items:
      - "{产品负责人}"
      - "{后台开发}"
      - "{PM}"
      - "{测试负责人}"
      - "{前端开发}"
      - "{视觉设计}"
      - "{后台负责人}"
      - "{开发者}"
      - "{待补充}"
      - "TBD"

  allowed_in_published_doc:
    description: "以下链接类占位符允许保留，表示该链接待后续补充（人员列禁止使用）"
    items:
      - "{后端技术方案链接}"
      - "{测试用例链接}"
      - "{任务平台链接}"
      - "{Figma 链接}"
      - "{Git 链接}"

# ========================================
# 缺失报告模板（LLM 报告给用户的固定文案）
# ========================================
missing_report_template: |
  以下关键人员信息在任务平台中未找到，请补充：

  | 缺失角色 | 说明 |
  |---------|------|
  | {role} | {reason} |

  请提供以上缺失人员的英文名（用户名），补充完整后我将继续生成技术方案文档。

# ========================================
# 配置版本（变更追踪）
# ========================================
meta:
