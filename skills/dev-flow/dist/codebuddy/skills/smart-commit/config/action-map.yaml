# smart-commit Skill - Action 与阈值配置
# 维护者：用户级 Skill smart-commit

# 合法 action 白名单（参考 @commitlint/config-conventional）
valid_actions:
  - feat
  - fix
  - chore
  - perf
  - refactor
  - docs
  - style
  - test
  - revert
  - build
  - ci

# git diff 体量阈值
# 超过此行数自动降级为 --stat 概览
diff_threshold:
  full_diff_max_lines: 200
