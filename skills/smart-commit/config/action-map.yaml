# smart-commit Skill - Action 与阈值配置
# 维护者：用户级 Skill smart-commit

# 合法 action 白名单（参考 @commitlint/config-conventional）
valid_actions:
  - feat
  - fix
  - chore
  - perf
  - refactor
  - docs
  - style
  - test
  - revert
  - build
  - ci

# git diff 体量阈值
# 超过此行数自动降级为 --stat 概览
diff_threshold:
  full_diff_max_lines: 200

# 分批提交（S0 入口路由 + references/batch-commit.md）
# 说明：这里只放「确定性阈值」，主题聚类由 LLM 判断
batch:
  enabled: true
  # 改动文件数达到该值才进入「是否需要分批」分析（低于则直接走单批，零额外开销）
  min_files: 5
  # 识别出的主题数达到该值才考虑分批
  min_themes: 2
  # 单一主题文件占比超过该值时，判定为「不该拆」（防止全仓格式化被强行拆批）
  max_theme_file_ratio: 0.7
  # 批次数上限，超过则提示「拆得过细，建议合并」而不是继续拆
  max_batches: 6
  # 总 diff 行数超过该值且存在多主题时，分批收益最大（单批会被降级为 --stat）
  diff_lines_trigger: 200
  # 敏感文件：默认排除出所有批次，仅提示，不自动提交
  sensitive_patterns:
    - ".env"
    - ".env.*"
    - "*.pem"
    - "*.key"
    - "*.p12"
    - "*.keystore"
    - "id_rsa*"
    - "credentials*"
  # 生成产物：提示但不强制排除（是否入库由用户判断）
  generated_patterns:
    - "dist/*"
    - "es/*"
    - "lib/*"
    - "*.lock"
